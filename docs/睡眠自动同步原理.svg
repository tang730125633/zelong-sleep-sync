<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="980" viewBox="0 0 1560 980" role="img" aria-labelledby="title desc">
<title id="title">泽龙的睡眠数据，怎样来到 AI 身边</title>
<desc id="desc">Apple Watch 记录睡眠并同步到 iPhone 的苹果健康。打开微信触发快捷指令读取近两天睡眠，经 HTTPS 上传到自己的 zelong.vip。服务器检查并去重保存，私人网站和 AI 通过 MCP 读取同一份数据。微信只负责触发，不接收健康数据。收到 imported 和 changed 表示服务器已处理，changed 为零表示没有新增或变化。</desc>
<defs>
 <style>
 text{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;fill:#203c32}
 .title{font-size:45px;font-weight:650;letter-spacing:1px}.h{font-size:26px;font-weight:650}.body{font-size:22px}.small{font-size:19px;fill:#53675e}.number{font-size:20px;font-weight:650;fill:#fff}.line{fill:none;stroke:#aac3b4;stroke-width:3;stroke-linecap:round}.icon{fill:none;stroke:#315c46;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
 </style>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#294734" flood-opacity=".055"/></filter>
</defs>
<rect width="1560" height="980" rx="38" fill="#f6f5ef"/>
<text x="68" y="65" class="small" style="letter-spacing:4px">泽龙 · 自己的设备，自己的数据</text>
<text x="68" y="132" class="title">睡眠记录，怎样来到 AI 身边？</text>
<text x="70" y="174" class="body" fill="#53675e">手表负责记录 · 微信负责触发 · 网站负责保存</text>

<!-- 微信只触发快捷指令 -->
<rect x="590" y="220" width="366" height="96" rx="32" fill="#e3eddf"/>
<circle cx="635" cy="267" r="23" fill="#315c46"/>
<path d="M625 259q10-8 20 0v12q-7 8-17 3l-6 4 2-9z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
<text x="675" y="260" class="h">你打开微信</text>
<text x="675" y="292" class="small">触发「立即运行」</text>
<path d="M773 316V351" class="line" stroke-dasharray="5 7"/>
<circle cx="773" cy="352" r="5" fill="#315c46"/>

<!-- 主流程连续轨道 -->
<path d="M322 474H360 M610 474H648 M898 474H936 M1186 474H1224" class="line"/>
<g fill="#315c46"><circle cx="342" cy="474" r="4"/><circle cx="629" cy="474" r="4"/><circle cx="917" cy="474" r="4"/><circle cx="1205" cy="474" r="4"/></g>

<!-- 1 -->
<rect x="72" y="356" width="250" height="264" rx="32" fill="#fff" filter="url(#shadow)"/>
<circle cx="108" cy="392" r="17" fill="#315c46"/><text x="108" y="399" text-anchor="middle" class="number">1</text>
<g class="icon"><rect x="260" y="378" width="30" height="36" rx="10"/><path d="M268 378v-9h14v9m-14 36v9h14v-9m-16-20 8 4 9-11"/></g>
<text x="96" y="459" class="h">Apple Watch</text>
<text x="96" y="498" class="body">记录你的睡眠</text>
<text x="96" y="541" class="small">同步到配对的 iPhone</text>
<text x="96" y="575" class="small">没电时不产生新记录</text>

<!-- 2 -->
<rect x="360" y="356" width="250" height="264" rx="32" fill="#fff" filter="url(#shadow)"/>
<circle cx="396" cy="392" r="17" fill="#315c46"/><text x="396" y="399" text-anchor="middle" class="number">2</text>
<path d="M566 412c-27-16-19-37-6-26 13-11 21 10-6 26" class="icon"/>
<text x="384" y="459" class="h">iPhone「健康」</text>
<text x="384" y="498" class="body">保存已有记录</text>
<text x="384" y="541" class="small">同步读取这里的数据</text>
<text x="384" y="575" class="small">不会修改健康原始记录</text>

<!-- 3 -->
<rect x="648" y="356" width="250" height="264" rx="32" fill="#e3eddf" filter="url(#shadow)"/>
<circle cx="684" cy="392" r="17" fill="#315c46"/><text x="684" y="399" text-anchor="middle" class="number">3</text>
<g class="icon"><path d="m857 377 17 11-17 11-17-11zM840 397l17 11 17-11M840 407l17 11 17-11"/></g>
<text x="672" y="459" class="h">睡眠同步快捷指令</text>
<text x="672" y="498" class="body">读取近两天睡眠</text>
<text x="672" y="541" class="small">你已允许持续上传</text>
<text x="672" y="575" class="small">经加密连接发往网站</text>

<!-- 4 -->
<rect x="936" y="356" width="250" height="264" rx="32" fill="#fff" filter="url(#shadow)"/>
<circle cx="972" cy="392" r="17" fill="#315c46"/><text x="972" y="399" text-anchor="middle" class="number">4</text>
<g class="icon"><ellipse cx="1144" cy="384" rx="18" ry="7"/><path d="M1126 384v27c0 10 36 10 36 0v-27m-36 14c0 10 36 10 36 0"/></g>
<text x="960" y="459" class="h">自己的 zelong.vip</text>
<text x="960" y="498" class="body">检查、去重、保存</text>
<text x="960" y="541" class="small">重复记录不重复累计</text>
<text x="960" y="575" class="small">有变化才更新数据</text>

<!-- 5 -->
<rect x="1224" y="356" width="264" height="264" rx="32" fill="#203c32"/>
<circle cx="1260" cy="392" r="17" fill="#d8e9db"/><text x="1260" y="399" text-anchor="middle" class="number" style="fill:#203c32">5</text>
<text x="1248" y="459" class="h" style="fill:#fff">网站与 AI 都能读</text>
<text x="1248" y="500" class="body" style="fill:#e0eddf">私人书桌：查看记录</text>
<text x="1248" y="542" class="body" style="fill:#e0eddf">AI：经 MCP 读取</text>
<text x="1248" y="582" class="small" style="fill:#c4d5c8">读取同一份已保存数据</text>

<!-- 回执 -->
<path d="M1061 620v38q0 19-19 19H773q-18 0-18 18v11" class="line"/>
<text x="1100" y="671" class="small">处理完，返回结果</text>
<rect x="72" y="710" width="1416" height="172" rx="32" fill="#ecefe6"/>
<text x="101" y="755" class="h">怎样知道这次成功了？</text>
<text x="101" y="798" class="body">出现 imported / changed</text>
<text x="101" y="835" class="small">说明服务器已经处理这批数据</text>
<path d="M440 747v99M950 747v99" stroke="#c6d1c5" stroke-width="2"/>
<text x="471" y="759" class="h">imported: 44</text>
<text x="471" y="800" class="body">处理了 44 条相关记录</text>
<text x="471" y="838" class="small">不是 44 天，也不一定全是新记录</text>
<text x="982" y="759" class="h">changed: 0</text>
<text x="982" y="800" class="body">没有新增或变化，正常</text>
<text x="982" y="838" class="small">已有数据不再重复保存</text>
<text x="74" y="925" class="small">微信只负责触发，不接收健康数据 · 当前已验证的是睡眠同步</text>
<text x="74" y="956" class="small">仅打开微信不等于上传成功 · 没网络或运行中断时，本次可能无法完成</text>
</svg>
